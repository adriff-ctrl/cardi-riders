<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarDi Riders</title>
<meta name="theme-color" content="#2E3134">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;margin:0}
  body{background:#232527;color:#D7DADD;font-family:Barlow,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
  img{width:min(62vw,280px);height:auto}
  h1{font:900 40px/1 'Big Shoulders Display',Impact,sans-serif;margin:0}
  p{margin:0;color:#9AA1A8}
  a{display:inline-block;background:#F2B33D;color:#2a1d05;font-weight:700;text-decoration:none;padding:14px 26px;border-radius:12px}
  .linea{width:180px;height:4px;background:repeating-linear-gradient(90deg,#F2B33D 0 22px,transparent 22px 36px)}
</style>
</head>
<body>
  <img src="logo.svg" alt="Logo CarDi Riders">
  <h1>CarDi Riders</h1>
  <div class="linea"></div>
  <p id="msg">Arrancando…</p>
  <a id="ir" href="#">Abrir la app</a>
<script>
  // Pega aquí la URL de la implementación de Apps Script (termina en /exec)
  const APP_URL = 'https://script.google.com/macros/s/AKfycbyg-NKh_EEofPLvwFFvw8wU2VM2G70CxmWZQUOuEzamkrh-I2fENKOSyafA2CRskPSBNg/exec';
  const ok = APP_URL.startsWith('https://script.google.com/');
  document.getElementById('ir').href = ok ? APP_URL : '#';
  if (ok) setTimeout(() => location.href = APP_URL, 900);
  else document.getElementById('msg').textContent = 'Falta poner la URL de la app en index.html';
</script>
</body>
</html>
