<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3134">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --asfalto:#232527; --asfalto-2:#2E3134; --asfalto-3:#3A3E42; --borde:#4A4F55;
  --linea:#F2B33D; --cromo:#D7DADD; --cromo-2:#9AA1A8; --cuero:#6B3A26; --rojo:#C2362B;
  --carmen:#F2B33D; --diego:#6FA3D6;
  --titulo:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --texto:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background-color:var(--asfalto);
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px),radial-gradient(rgba(0,0,0,.3) 1px,transparent 1px);
  background-size:3px 3px,5px 5px;background-position:0 0,1px 2px;
  color:var(--cromo);font:16px/1.45 var(--texto);overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--linea);outline-offset:2px}
h2{font:800 32px/1 var(--titulo);margin:4px 0 14px;color:var(--cromo);letter-spacing:.01em}
h3{font:700 19px/1.2 var(--texto);margin:0}
p{margin:6px 0}

.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;height:100dvh}

/* Cabecera */
header.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 9px;background:var(--asfalto-2);position:relative;z-index:900}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--asfalto-3) repeating-linear-gradient(90deg,var(--linea) 0 26px,transparent 26px 44px)}
.marca{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.marca svg{width:46px;height:46px;flex:none}
.marca h1{font:900 27px/1 var(--titulo);margin:0;letter-spacing:.02em}
.marca small{display:block;font-size:13px;color:var(--cromo-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.piloto{display:flex;align-items:center;gap:7px;background:var(--asfalto-3);border:1px solid var(--borde);color:var(--cromo);border-radius:22px;padding:6px 12px 6px 7px;font-weight:700;font-size:15px;cursor:pointer;min-height:40px}
.casco{width:26px;height:26px;border-radius:50%;background:var(--c,var(--cromo-2));display:grid;place-items:center;color:#1d1d1d;font:800 14px var(--titulo)}

main{position:relative;overflow:hidden}
.vista{position:absolute;inset:0;overflow-y:auto;display:none;padding:18px 14px 28px;-webkit-overflow-scrolling:touch}
.vista.activa{display:block}
.vista > .ancho{max-width:640px;margin:0 auto}
#vista-mapa{padding:0}
#mapa{position:absolute;inset:0;background:#1f2123}

/* Navegación inferior */
nav.abajo{display:grid;grid-template-columns:repeat(4,1fr);background:var(--asfalto-2);border-top:1px solid var(--borde);padding-bottom:env(safe-area-inset-bottom,0px);z-index:900}
nav.abajo button{background:none;border:0;color:var(--cromo-2);font-weight:600;font-size:13px;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
nav.abajo svg{width:25px;height:25px}
nav.abajo button[aria-current="page"]{color:var(--linea)}
nav.abajo button[aria-current="page"]::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;background:repeating-linear-gradient(90deg,var(--linea) 0 10px,transparent 10px 16px)}

/* Botones */
.btn{font-weight:700;font-size:15px;line-height:1;border-radius:10px;border:1px solid var(--borde);background:var(--asfalto-3);color:var(--cromo);padding:11px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.prim{background:var(--linea);color:#2a1d05;border-color:#c98f22}
.btn.peligro{background:transparent;border-color:#7d2f28;color:#f0958b}
.btn.mini{min-height:38px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:default}

/* Mapa: controles flotantes */
.mapa-arriba{position:absolute;top:10px;left:10px;right:10px;z-index:700;pointer-events:none}
.mapa-arriba > *{pointer-events:auto}
.busca{display:flex;gap:6px}
.busca input{flex:1;min-width:0}
.res-sitio{margin-top:6px;background:var(--asfalto-2);border:1px solid var(--borde);border-radius:12px;overflow:hidden;max-height:45vh;overflow-y:auto}
.res-sitio button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--asfalto-3);color:var(--cromo);padding:11px 14px;font-size:15px;cursor:pointer}
.res-sitio button small{display:block;color:var(--cromo-2);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:rgba(46,49,52,.94);border:1px solid var(--borde);color:var(--cromo);border-radius:18px;padding:6px 11px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--linea);color:#2a1d05;border-color:var(--linea)}
.fabs{position:absolute;right:12px;bottom:16px;z-index:700;display:flex;flex-direction:column;gap:9px;align-items:flex-end}
.fab{width:50px;height:50px;border-radius:50%;border:1px solid var(--borde);background:var(--asfalto-2);color:var(--cromo);font-size:21px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.45);display:grid;place-items:center}
.fab.largo{width:auto;border-radius:25px;padding:0 18px;font-size:15px;font-weight:700}
.fab.prim{background:var(--linea);color:#2a1d05;border-color:#c98f22}
.panel-mapa{position:absolute;left:12px;right:12px;bottom:16px;z-index:750;background:var(--asfalto-2);border:1px solid var(--borde);border-left:5px solid var(--linea);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.panel-mapa .fila-acc{margin-top:10px}
#info-ruta{right:76px}
.datos-ruta{display:flex;gap:14px;flex-wrap:wrap;color:var(--cromo-2);font-size:14px;margin-top:4px}
.datos-ruta b{color:var(--cromo);font-weight:700}

/* Leaflet en tono taller */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--asfalto-2);color:var(--cromo);box-shadow:0 4px 14px rgba(0,0,0,.5)}
.leaflet-popup-content-wrapper{border-radius:12px;border:1px solid var(--borde)}
.leaflet-popup-content{margin:12px 14px;font:15px/1.4 var(--texto)}
.leaflet-container a.leaflet-popup-close-button{color:var(--cromo-2)}
.leaflet-control-attribution{background:rgba(35,37,39,.8)!important;color:var(--cromo-2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--cromo)!important}
.pop strong{font-size:17px;display:block}
.pop .pop-tipo{color:var(--cromo-2);font-size:14px;margin:2px 0 4px}
.pop-acc{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.pin{width:34px;height:42px}
.pin .cabeza{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2px solid rgba(255,255,255,.75);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.pin .cabeza span{transform:rotate(45deg);font-size:16px;line-height:1}
.parada{width:26px;height:26px;border-radius:50%;background:var(--asfalto-2);border:3px solid var(--linea);color:var(--linea);display:grid;place-items:center;font:800 14px var(--titulo);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.parada.ini{background:var(--linea);color:#2a1d05}
.parada.fin{background:var(--rojo);border-color:#fff;color:#fff}
.yo{width:18px;height:18px;border-radius:50%;background:#4aa3ff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(74,163,255,.25)}

/* Cuadro de mandos con costuras */
.cuadro{background:var(--asfalto-2);border:1px solid var(--cuero);border-radius:16px;padding:18px 18px 16px;position:relative;margin-bottom:18px}
.cuadro::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(242,179,61,.28);border-radius:11px;pointer-events:none}
.cuadro .rotulo{color:var(--cromo-2);font-size:14px;margin:0 0 8px}
.odo{display:flex;gap:4px;align-items:flex-end}
.odo .d{width:34px;height:46px;background:#000;border-radius:4px;overflow:hidden;position:relative}
.odo .d::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.65),transparent 30%,transparent 70%,rgba(0,0,0,.65));pointer-events:none}
.odo .d.dec{background:#f3f1ec;margin-left:3px}
.odo .rueda{display:flex;flex-direction:column}
.odo.anima .rueda{transition:transform 1.6s cubic-bezier(.2,.75,.15,1)}
.odo .rueda span{height:46px;line-height:46px;text-align:center;font:700 32px var(--texto);color:#f3f1ec;font-variant-numeric:tabular-nums}
.odo .d.dec span{color:#000}
.odo-km{font:800 22px var(--titulo);color:var(--linea);margin-left:8px;padding-bottom:4px}
.marcadores{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:14.5px;color:var(--cromo-2)}
.marcadores b{color:var(--cromo);font:800 22px/1 var(--titulo);margin-right:4px}

/* Listas de rutas y puntos */
.seg{display:flex;background:var(--asfalto);border-radius:11px;padding:3px;border:1px solid var(--borde);margin-bottom:14px}
.seg button{flex:1;background:none;border:0;color:var(--cromo-2);padding:9px 6px;border-radius:8px;font-weight:600;font-size:14.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--asfalto-3);color:var(--linea)}
.fila{position:relative;padding:14px 14px 14px 28px;background:var(--asfalto-2);border-radius:12px;margin-bottom:10px;border:1px solid var(--borde)}
.fila::before{content:"";position:absolute;left:11px;top:13px;bottom:13px;width:4px;border-radius:2px;background:repeating-linear-gradient(180deg,var(--linea) 0 12px,transparent 12px 20px)}
.fila.hecha::before{background:var(--cromo-2)}
.fila.punto::before{background:var(--c)}
.fila-cab{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.km{font:800 22px/1 var(--titulo);color:var(--linea);white-space:nowrap}
.fila-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--cromo-2);font-size:14px;margin-top:6px}
.fila p{color:var(--cromo);font-size:15px}
.fila-acc{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.autor{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--cromo)}
.autor::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--a)}
.curvas{display:inline-flex;gap:3px;align-items:center}
.curvas i{width:6px;height:13px;border-radius:3px;background:var(--asfalto-3)}
.curvas i.on{background:var(--linea)}
.estrellas-txt{color:var(--linea);letter-spacing:1px}
.vacio{border:2px dashed var(--borde);border-radius:14px;padding:22px 18px;text-align:center;color:var(--cromo-2)}
.vacio p{margin:0 0 12px}
.filtros{display:grid;gap:9px;margin-bottom:14px}
.filtros .lin{display:flex;gap:8px}
.filtros .lin > *{flex:1}
.lugares{color:var(--cromo-2);font-size:14px}
.aviso{font-size:13.5px;color:var(--cromo-2);margin-top:16px}

/* Formularios */
input,select,textarea{width:100%;font:16px var(--texto);background:var(--asfalto);color:var(--cromo);border:1px solid var(--borde);border-radius:10px;padding:11px 12px;min-height:44px}
textarea{resize:vertical}
.campo{display:block;margin-bottom:15px}
.campo > span{display:block;font-weight:600;font-size:14px;color:var(--cromo-2);margin-bottom:6px}
.tipos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px}
.tipo{background:var(--asfalto);border:1px solid var(--borde);color:var(--cromo);border-radius:10px;padding:9px 6px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tipo b{font-size:21px;font-weight:400}
.tipo[aria-pressed="true"]{border-color:var(--linea);background:rgba(242,179,61,.13);color:var(--linea)}
.estrellas{display:flex;gap:4px}
.estrellas button{background:none;border:0;font-size:30px;color:var(--asfalto-3);cursor:pointer;padding:0 2px;line-height:1}
.estrellas button.on{color:var(--linea)}
.acciones{display:flex;gap:8px;align-items:center;margin-top:6px}
.acciones .hueco{flex:1}
.coords{color:var(--cromo-2);font-size:13px}
.resumen-ruta{display:flex;gap:18px;margin-bottom:14px}
.resumen-ruta div{font-size:13px;color:var(--cromo-2)}
.resumen-ruta b{display:block;font:800 26px/1 var(--titulo);color:var(--linea)}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;align-items:flex-end;justify-content:center}
.velo.abierto{display:flex}
.hoja{width:100%;max-width:560px;max-height:90dvh;overflow-y:auto;background:var(--asfalto-2);border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));position:relative;border-top:3px solid var(--cuero);animation:sube .22s ease-out}
.hoja::before{content:"";position:absolute;inset:7px 7px 0;border:2px dashed rgba(242,179,61,.22);border-bottom:0;border-radius:15px 15px 0 0;pointer-events:none}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.pilotos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.pilotos button{background:var(--asfalto);border:2px solid var(--borde);border-radius:16px;padding:20px 10px;color:var(--cromo);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:10px;font:800 24px var(--titulo)}
.pilotos button .casco{width:56px;height:56px;font-size:28px}
.pilotos button[aria-pressed="true"]{border-color:var(--linea)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--cromo);color:#1e1f21;font-weight:600;padding:11px 16px;border-radius:10px;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 28px);text-align:center}
.toast.ver{opacity:1;transform:translate(-50%,0)}
.cargando{color:var(--cromo-2);padding:30px 0;text-align:center}

@media (min-width:760px){
  .panel-mapa{left:auto;width:380px;right:80px}
}
@media (prefers-reduced-motion:reduce){
  .odo.anima .rueda,.hoja,.toast{transition:none;animation:none}
}
</style>
</head>

  <defs>

      <text font-family="'Big Shoulders Display',Impact,sans-serif" font-weight="800" font-size="38" fill="#F2B33D" letter-spacing="9"><textPath href="#arcoAbajo" startOffset="50%" text-anchor="middle">RIDERS</textPath></text>

      <circle cx="176" cy="300" r="8" fill="#D7DADD"/>
      <circle cx="330" cy="300" r="8" fill="#D7DADD"/>

    <symbol id="i-mapa" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

    <symbol id="i-buscar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="9.5" r="2.6" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <div class="marca">
      <svg role="img" aria-label="Logo CarDi Riders"><use href="#logo"/></svg>
      <div><h1>CarDi Riders</h1><small>Rutas en moto de Carmen y Diego</small></div>
    </div>
    <button class="piloto" data-act="elegir-piloto" aria-label="Cambiar quién usa la app">
      <span class="casco" id="casco-piloto">?</span><span id="txt-piloto">¿Quién?</span>
    </button>
  </header>

  <main>
    <section class="vista activa" id="vista-mapa" aria-label="Mapa">
      <div id="mapa"></div>
      <div class="mapa-arriba">
        <form class="busca" id="f-sitio">
          <input id="q-sitio" type="search" placeholder="Buscar pueblo, puerto o sitio" autocomplete="off" aria-label="Buscar sitio">
          <button class="btn" type="submit" aria-label="Buscar sitio">Ir</button>
        </form>
        <div class="res-sitio" id="res-sitio" hidden></div>
        <div class="chips" id="chips-mapa"></div>
      </div>
      <div class="panel-mapa" id="info-ruta" hidden></div>
      <div class="fabs" id="fabs">
        <button class="fab" data-act="capa" title="Cambiar mapa" aria-label="Cambiar tipo de mapa">🗺️</button>
        <button class="fab" data-act="centrar" title="Dónde estoy" aria-label="Centrar en mi posición">🎯</button>
        <button class="fab largo" data-act="trazar">Trazar ruta</button>
        <button class="fab largo prim" data-act="punto-gps">Marcar dónde estoy</button>
      </div>
      <div class="panel-mapa" id="barra-trazado" hidden></div>
    </section>
    <section class="vista" id="vista-rutas" aria-label="Mis rutas"><div class="ancho"></div></section>
    <section class="vista" id="vista-buscar" aria-label="Buscar rutas"><div class="ancho"></div></section>
    <section class="vista" id="vista-puntos" aria-label="Puntos"><div class="ancho"></div></section>
  </main>
